name: Sandcastle Dispatch

# This repo holds no code — it's the centralized issue tracker for all 4
# AIARAP app repos (docs/agents/issue-tracker.md in AIARAP---DOCUMENTATION).
# When a ticket becomes ready for an agent, this workflow reads its single
# repo:* label and fires that app repo's own agent-implement.yml, passing
# the issue number/title as inputs (workflow_dispatch, not an in-repo
# trigger — the app repo has no issues of its own to react to).

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'Sandcastle' || github.event.label.name == 'retry:sandcastle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sandcastle-dispatch-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.AGENT_PAT }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Refuse if AGENT_PAT is not configured
        if: env.GH_TOKEN == ''
        run: |
          echo "::error::secrets.AGENT_PAT is not set on this repo. See .sandcastle-dispatch/README.md — needed to fire workflow_dispatch on the 4 app repos and to manage cross-repo labels."
          exit 1

      - name: Clear retry:sandcastle if that's what fired this
        if: github.event.label.name == 'retry:sandcastle'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "retry:sandcastle" || true

      - name: Idempotency guard — skip if already dispatched
        id: guard
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]')
          already=$(echo "$labels" | jq 'index("sandcastle:dispatched") != null')
          if [ "$already" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target repo from the repo:* label
        if: steps.guard.outputs.proceed == 'true'
        id: target
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]')
          repo_label=$(echo "$labels" | jq -r '[.[] | select(startswith("repo:"))] | .[0] // empty')
          if [ -z "$repo_label" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Refused to dispatch: no repo:* label found. Every ticket must carry exactly one (docs/agents/issue-tracker.md)."
            gh issue edit "$ISSUE_NUMBER" --add-label "sandcastle:blocked" || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$repo_label" in
            repo:node-backend)   target_repo="VarunERPSolutions/AIARAP-node-backend" ;;
            repo:external-app)   target_repo="VarunERPSolutions/AIARAP-external-app" ;;
            repo:support-app)    target_repo="VarunERPSolutions/AIARAP-support-app" ;;
            repo:spring-backend) target_repo="VarunERPSolutions/AIARAP-spring-backend" ;;
            *)
              gh issue comment "$ISSUE_NUMBER" --body "Refused to dispatch: unrecognized label '$repo_label'. Expected one of repo:node-backend, repo:external-app, repo:support-app, repo:spring-backend."
              gh issue edit "$ISSUE_NUMBER" --add-label "sandcastle:blocked" || true
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Check blockers — parse "Blocked by #N" in the body, verify each is closed
        if: steps.guard.outputs.proceed == 'true' && steps.target.outputs.proceed == 'true'
        id: blockers
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
          blockers=$(echo "$body" | grep -oiE '\bblocked by[^\n]*' | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
          open_blockers=""
          for n in $blockers; do
            if [ "$n" = "$ISSUE_NUMBER" ]; then continue; fi
            state=$(gh issue view "$n" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            if [ "$state" != "CLOSED" ]; then
              open_blockers="$open_blockers #$n"
            fi
          done
          if [ -n "$open_blockers" ]; then
            echo "Still blocked by:$open_blockers — not dispatching yet. promote-blocked.yml will re-check when each closes."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire agent-implement.yml on the target repo
        # Deliberately runs BEFORE "Mark dispatched" — the label must only
        # ever reflect a dispatch that actually happened. Marking it first
        # (the original bug) meant a failure in this step — e.g. the token
        # not yet having access to the target repo — left the issue
        # permanently marked "dispatched" even though nothing was fired,
        # silently swallowing every later retry via the idempotency guard.
        if: steps.guard.outputs.proceed == 'true' && steps.target.outputs.proceed == 'true' && steps.blockers.outputs.ready == 'true'
        env:
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          gh workflow run agent-implement.yml --repo "$TARGET_REPO" \
            -f issue_number="$ISSUE_NUMBER" \
            -f issue_title="$title"

      - name: Mark dispatched (idempotency for this + future re-labels)
        # Only reached if the fire step above actually succeeded — a failed
        # step stops the job by default, so this and the comment below are
        # skipped automatically on failure, with no extra `if` needed.
        if: steps.guard.outputs.proceed == 'true' && steps.target.outputs.proceed == 'true' && steps.blockers.outputs.ready == 'true'
        env:
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "sandcastle:dispatched"
          gh issue comment "$ISSUE_NUMBER" --body "Dispatched to \`$TARGET_REPO\`'s \`agent-implement.yml\`."
